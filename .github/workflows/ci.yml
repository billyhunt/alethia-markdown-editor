name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch is wasted work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint and test
    # The suite runs against jsdom, not a real Electron runtime, so Linux is
    # enough here and is both faster and cheaper than a macOS runner. The
    # packaged build below is what needs macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # The postinstall step patches the development Electron bundle and
      # no-ops off macOS, so a plain install is safe here.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Summarise coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("| Metric | Covered | Count |");
              console.log("|---|---|---|");
              for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

  package:
    name: Packaged macOS build
    # An Electron build can break while every unit test still passes, which is
    # exactly the failure that should not be discovered on release day. The
    # build is unsigned, so it needs no certificates.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Package
        run: npm run package

      # electron-builder can exit 0 and still leave an unshippable bundle, so
      # inspect the output rather than trusting the exit code.
      - name: Verify the app bundle
        run: npm run verify:package

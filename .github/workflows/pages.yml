name: Pages

# Publishes the style guide (docs/style-guide) and the files it loads from
# docs/ and build/ to GitHub Pages. The site keeps the repository's own paths,
# so the guide's relative links (../../build/icon.svg, ../screenshots/) work
# unchanged on the site and in a local checkout.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deploy at a time, and let a running deploy finish: cancelling one
# part-way can leave the site half published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Assemble site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Assemble site
        run: |
          mkdir _site
          cp -R docs build _site/
          # The site root has no page of its own; send visitors to the guide.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Alethia</title>
          <meta http-equiv="refresh" content="0; url=docs/style-guide/">
          <link rel="canonical" href="docs/style-guide/">
          <p><a href="docs/style-guide/">Alethia style guide</a></p>
          HTML
          # Serve files as they are: no Jekyll processing of the Markdown or
          # of directories that start with an underscore.
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

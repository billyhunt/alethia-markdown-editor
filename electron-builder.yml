appId: com.billyhunt.alethia
productName: Alethia
directories:
  buildResources: build
  output: release
icon: build/icon.icns
files:
  - dist/**
  - dist-electron/**
  - package.json
  # The bundled fonts are OFL, which requires the licence to travel with
  # every redistributed copy -- including inside the .app.
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**
asar: true
# Electron fuses are flipped in the packaged binary before it is signed. They
# close the ways a local process could run its own code under the app's
# signed identity: ELECTRON_RUN_AS_NODE, NODE_OPTIONS and --inspect, or a
# loose app/ directory in place of the validated app.asar. Playwright attaches
# through --inspect, so a packaged end-to-end run needs a build with
# enableNodeCliInspectArguments on (see the README).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Flipping fuses invalidates Electron's ad-hoc signature, and an arm64 binary
  # with a stale signature is killed at launch. Re-sign ad hoc when no real
  # identity signs the bundle afterwards.
  resetAdHocDarwinSignature: true
  # grantFileProtocolExtraPrivileges stays on (the default): the renderer is
  # loaded with loadFile, which needs them.
mac:
  category: public.app-category.productivity
  target: [dir]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Hardened runtime and entitlements are what notarization requires. They do
  # nothing to an unsigned build. Whether a build is signed and notarized is
  # decided by the npm script that runs electron-builder (see package.json),
  # not here, so a missing certificate can never fail a local build.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
fileAssociations:
  - ext: [md, markdown, mdown, mkd]
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    # Owner declares Alethia as a primary handler for markdown, so macOS
    # offers it as the default rather than only listing it under "Open With".
    # Which app actually wins is still Launch Services' decision, and an
    # existing binding is left alone until the user changes it.
    rank: Owner

appId: com.billyhunt.alethia
productName: Alethia
directories:
  buildResources: build
  output: release
icon: build/icon.icns
files:
  - dist/**
  - dist-electron/**
  - package.json
  # The bundled fonts are OFL, which requires the licence to travel with
  # every redistributed copy -- including inside the .app.
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**
asar: true
mac:
  category: public.app-category.productivity
  target: [dir]
  # Unsigned local builds. Remove this (and add hardenedRuntime, entitlements
  # and notarize) when a Developer ID certificate is available.
  identity: null
  darkModeSupport: true
fileAssociations:
  - ext: [md, markdown, mdown, mkd]
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    # Owner declares Alethia as a primary handler for markdown, so macOS
    # offers it as the default rather than only listing it under "Open With".
    # Which app actually wins is still Launch Services' decision, and an
    # existing binding is left alone until the user changes it.
    rank: Owner

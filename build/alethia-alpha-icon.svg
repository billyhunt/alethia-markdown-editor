<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Alethia alpha app icon candidate</title>
  <desc id="desc">A Greek alpha whose orange terminal completes the letter.</desc>
  <!-- The same ink-on-paper field as the editor, with a hard typesetter's rule. -->
  <rect width="1024" height="1024" rx="224" fill="#f2f0eb"/>
  <rect x="35" y="35" width="954" height="954" rx="190" fill="none" stroke="#111111" stroke-width="42"/>

  <!-- α: a deliberately geometric Greek alpha, not a Latin monogram. -->
  <path fill="#111111" fill-rule="evenodd" d="M356 733c-103 0-183-89-183-216 0-145 92-257 222-257 70 0 124 32 154 76V247h117v486H549v-58c-39 39-104 58-193 58Zm48-119c83 0 145-56 145-142 0-58-40-101-96-101-73 0-120 62-120 145 0 62 28 98 71 98Zm145-239v237h117V375H549Z"/>

  <!-- The alpha's descending terminal is the live, orange insertion point. -->
  <path fill="#ff3b00" d="M549 612h117v170H549z"/>
</svg>
